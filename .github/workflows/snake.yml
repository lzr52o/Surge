name: Generate Contribution Graphics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: lzr52o
          games: 'pacman'
          hide_month_labels: 'false'

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: lzr52o
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D Contrib
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: lzr52o

      - name: Collect 3D SVGs into dist
        run: |
          cp profile-3d-contrib/profile-green-animate.svg dist/profile-3d.svg
          cp profile-3d-contrib/profile-night-green.svg dist/profile-3d-dark.svg
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
